[project]
name = "falae"
version = "0.1.0"
description = "Turn an article into a single MP3 using Google Cloud Text-to-Speech (Chirp 3 HD)."
requires-python = ">=3.11"
dependencies = [
    "google-cloud-texttospeech>=2.38",
    "google-cloud-storage>=2.18",
    "dropbox>=12.0",
    "markdown-it-py>=3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["falae"]

[tool.pytest.ini_options]
testpaths = ["tests"]
